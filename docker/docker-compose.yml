# 로컬 개발용 compose.
#
#   docker compose -f docker/docker-compose.yml up -d --build api frontend   # API + 프론트
#   docker compose -f docker/docker-compose.yml --profile gpu up api-gpu     # GPU 추론 서버
#   docker compose -f docker/docker-compose.yml --profile triton up triton   # Triton
#
# 떠돌이 컨테이너 정리하며 올리려면: up -d --build --remove-orphans

services:
  # 1. 백엔드 API 서버 (CPU). MockPipeline 로 동작, 실제 모델은 api-gpu / triton.
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: ad-service:cpu
    ports:
      - "8000:8000"
    env_file:
      - path: ../.env
        required: false
    environment:
      AD_ENVIRONMENT: development
      AD_OUTPUT_ROOT: /app/var/outputs
      AD_UPLOAD_ROOT: /app/var/uploads
    volumes:
      - ../src:/app/src
      - ../configs:/app/configs
      - ../data:/app/data:ro          # 입력 데이터셋은 읽기 전용
      - api-var:/app/var              # 생성 결과/업로드 (쓰기)
    command: uvicorn ad_service.api.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # 2. 프론트엔드 (Streamlit).
  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    image: ad-service:frontend
    ports:
      - "8501:8501"
    environment:
      # frontend/app.py 는 이 값을 읽어 API 를 호출한다 (하드코딩 금지).
      API_BASE_URL: http://api:8000/api/v1
    volumes:
      - ../frontend:/app
    command: streamlit run app.py --server.address=0.0.0.0 --server.port=8501
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # 3. 백엔드 GPU 추론 서버.
  api-gpu:
    profiles: ["gpu"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.gpu
    image: ad-service:gpu
    ports:
      - "8000:8000"
    env_file:
      - path: ../.env
        required: false
    volumes:
      - ../models/checkpoints:/app/models/checkpoints
      - ../data:/app/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # 4. NVIDIA Triton Inference Server (모델 서빙 전용).
  triton:
    profiles: ["triton"]
    image: nvcr.io/nvidia/tritonserver:24.05-py3
    ports:
      - "8001:8000"   # HTTP
      - "8002:8001"   # gRPC
      - "8003:8002"   # metrics (Prometheus)
    volumes:
      - ../deploy/triton/model_repository:/models
    command: tritonserver --model-repository=/models --model-control-mode=poll
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  api-var:
