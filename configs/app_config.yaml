# 앱 / 서빙 설정. 환경변수로 오버라이드 가능 (core/config.py 참고).
app:
  name: ad_service
  env: development
  host: 0.0.0.0
  port: 8000
  log_level: INFO

inference:
  backend: local          # local | triton
  triton:
    url: localhost:8001
    protocol: http        # http | grpc
    vlm_model: vlm
    image_model: image_generator

limits:
  max_prompt_chars: 4000
  max_image_mb: 10
  request_timeout_s: 120
