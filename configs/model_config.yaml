# 3일 베이스라인 비교 모델. 기본값은 비용이 들지 않는 mock이다.
copy_models:
  default: gpt-5.4-mini
  candidates:
    - gpt-5.4-mini
    - gpt-5.4-nano
    - Qwen/Qwen3-8B
  qwen:
    dtype: auto
    device_map: auto
    max_new_tokens: 900
    enable_thinking: false

image_models:
  default: gpt-image-2
  candidates:
    - gpt-image-2
    - black-forest-labs/FLUX.2-klein-4B
  gpt_image_2:
    quality: medium
  flux:
    dtype: bfloat16
    device: cuda
    num_inference_steps: 4
    guidance_scale: 1.0

background_removal:
  default: ZhengPeng7/BiRefNet
  fallback: simple-border-flood-v1
  resolution: 1024

asset_sizes:
  banner: [1536, 1024]
  detail_visual: [1024, 1536]
  product_image: [1024, 1024]

cache_dir: ./models/checkpoints
