<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>광고 생성 모델 실험실</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
      --ink: #1e2430;
      --muted: #697386;
      --line: #dde2ea;
      --panel: #ffffff;
      --accent: #6c4df6;
      --accent-dark: #5035ce;
      --background: #f5f6fa;
    }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: var(--background); }
    main { width: min(1120px, calc(100% - 32px)); margin: 40px auto 80px; }
    h1 { margin: 0 0 8px; font-size: clamp(28px, 4vw, 42px); }
    p { line-height: 1.65; }
    .intro { color: var(--muted); margin: 0 0 24px; }
    .notice {
      padding: 12px 16px; margin-bottom: 20px; border: 1px solid #d9d0ff;
      border-radius: 12px; color: #4f3bac; background: #f0edff;
    }
    .panel { padding: 24px; border: 1px solid var(--line); border-radius: 18px; background: var(--panel); }
    label, legend { display: block; margin-bottom: 8px; font-weight: 700; }
    textarea, input[type="text"], select {
      width: 100%; padding: 13px 14px; border: 1px solid #cbd2dc; border-radius: 10px;
      font: inherit; background: #fff;
    }
    textarea { min-height: 130px; resize: vertical; }
    textarea:focus, input:focus, select:focus {
      outline: 3px solid #ded7ff; border-color: var(--accent);
    }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 18px; }
    fieldset { margin: 20px 0; padding: 0; border: 0; }
    .checks { display: flex; flex-wrap: wrap; gap: 12px; }
    .check {
      display: flex; align-items: center; gap: 7px; padding: 9px 12px;
      border: 1px solid var(--line); border-radius: 10px; font-weight: 500;
    }
    button {
      width: 100%; padding: 14px 18px; border: 0; border-radius: 11px;
      color: #fff; background: var(--accent); font: inherit; font-weight: 800; cursor: pointer;
    }
    button:hover { background: var(--accent-dark); }
    button:disabled { cursor: wait; opacity: .65; }
    #status { min-height: 26px; margin: 18px 0 0; color: var(--muted); }
    #error { display: none; margin-top: 16px; padding: 13px; border-radius: 10px; color: #8d1b1b; background: #ffe9e9; }
    #results { display: none; margin-top: 28px; }
    .copy-grid, .asset-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .card { overflow: hidden; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); }
    .card-body { padding: 16px; }
    .card h3 { margin: 0 0 10px; font-size: 17px; }
    .card p { margin: 0; color: var(--muted); }
    .asset-grid img { display: block; width: 100%; height: 280px; object-fit: contain; background: #eef0f4; }
    .metrics { margin-top: 16px; color: var(--muted); font-size: 14px; }
    @media (max-width: 760px) {
      .row, .copy-grid, .asset-grid { grid-template-columns: 1fr; }
      main { margin-top: 24px; }
    }
  </style>
</head>
<body>
  <main>
    <h1>광고 생성 모델 실험실</h1>
    <p class="intro">프롬프트와 원하는 산출물을 선택해 공통 파이프라인의 결과를 확인합니다.</p>
    <div class="notice">
      현재 기본 설정은 Mock 모델입니다. 화면과 파일 생성 흐름은 확인할 수 있지만,
      실제 프롬프트 이해 능력과 이미지 품질 평가는 실제 모델 연결 후 진행합니다.
    </div>

    <form id="generation-form" class="panel">
      <label for="prompt">프롬프트</label>
      <textarea id="prompt" required>지역 농산물로 만든 수제 딸기잼이 나무 테이블 위에 놓인 따뜻한 분위기의 광고 배너. 왼쪽에는 광고 문구를 넣을 빈 공간을 남겨줘.</textarea>

      <div class="row">
        <div>
          <label for="product-category">상품 카테고리</label>
          <select id="product-category" required>
            <option value="snack_beverage">간식·음료</option>
            <option value="packaged_food" selected>가공·포장식품</option>
            <option value="side_dish_meal">반찬·간편식</option>
          </select>
        </div>
        <div>
          <label for="sales-channel">판매 채널</label>
          <select id="sales-channel" required>
            <option value="smart_store" selected>스마트스토어</option>
            <option value="social_media">SNS</option>
            <option value="delivery_app">배달앱</option>
            <option value="offline_store">오프라인 매장</option>
          </select>
        </div>
      </div>

      <div class="row">
        <div>
          <label for="campaign-goal">광고 목적</label>
          <select id="campaign-goal" required>
            <option value="product_launch" selected>신상품 소개</option>
            <option value="promotion">할인·이벤트 안내</option>
            <option value="brand_awareness">브랜드 홍보</option>
            <option value="purchase_conversion">구매 유도</option>
          </select>
        </div>
        <div>
          <label for="audience">대상 고객</label>
          <input id="audience" type="text" value="지역 먹거리에 관심 있는 20~30대">
        </div>
      </div>

      <div class="row">
        <div>
          <label for="tone">광고 분위기</label>
          <input id="tone" type="text" value="따뜻하고 자연스러운">
        </div>
        <div>
          <label for="copy-style">문구 스타일</label>
          <select id="copy-style">
            <option value="emotional">감성형</option>
            <option value="informative" selected>정보 중심형</option>
            <option value="conversion">구매 유도형</option>
            <option value="friendly">친근하고 유쾌한 형</option>
            <option value="premium">고급스럽고 차분한 형</option>
            <option value="custom">직접 입력</option>
          </select>
        </div>
      </div>

      <div class="row">
        <div>
          <label for="copy-length">문구 길이</label>
          <select id="copy-length">
            <option value="short">짧게</option>
            <option value="standard" selected>보통</option>
            <option value="detailed">자세하게</option>
          </select>
        </div>
        <div>
          <label for="custom-instruction">추가 스타일 요청</label>
          <input id="custom-instruction" type="text" placeholder="예: 동네 가게처럼 정겹게">
        </div>
      </div>

      <div class="row">
        <div>
          <label for="must-include">반드시 포함할 표현</label>
          <input id="must-include" type="text" placeholder="예: 국산 딸기, 300g">
        </div>
        <div>
          <label for="avoid-phrases">사용하지 않을 표현</label>
          <input id="avoid-phrases" type="text" placeholder="예: 최고, 건강에 좋은">
        </div>
      </div>

      <label class="check"><input id="use-emoji" type="checkbox"> 이모지 사용</label>

      <fieldset>
        <legend>만들 결과</legend>
        <div class="checks">
          <label class="check"><input type="checkbox" name="outputs" value="copy" checked> 광고 문구</label>
          <label class="check"><input type="checkbox" name="outputs" value="banner" checked> 배너</label>
          <label class="check"><input type="checkbox" name="outputs" value="detail_visual"> 상세 시각자료</label>
          <label class="check"><input type="checkbox" name="outputs" value="product_image"> 제품 이미지</label>
        </div>
      </fieldset>

      <button id="submit-button" type="submit">결과 만들기</button>
      <div id="status" aria-live="polite"></div>
      <div id="error" role="alert"></div>
    </form>

    <section id="results">
      <h2>생성 결과</h2>
      <div id="copy-results" class="copy-grid"></div>
      <div id="asset-results" class="asset-grid"></div>
      <p id="metrics" class="metrics"></p>
    </section>
  </main>

  <script>
    // 쉼표로 입력한 표현을 API가 사용하는 문자열 목록으로 바꿉니다.
    function commaSeparatedValues(id) {
      return document.getElementById(id).value
        .split(",")
        .map((value) => value.trim())
        .filter(Boolean);
    }

    // HTML을 문자열로 직접 조립하지 않고 textContent를 사용해 모델 응답을 안전하게 표시합니다.
    function addCopyCard(container, title, items) {
      const card = document.createElement("article");
      card.className = "card";
      const body = document.createElement("div");
      body.className = "card-body";
      const heading = document.createElement("h3");
      heading.textContent = title;
      body.appendChild(heading);
      items.forEach((item) => {
        const paragraph = document.createElement("p");
        paragraph.textContent = item;
        body.appendChild(paragraph);
      });
      card.appendChild(body);
      container.appendChild(card);
    }

    document.getElementById("generation-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const button = document.getElementById("submit-button");
      const status = document.getElementById("status");
      const error = document.getElementById("error");
      const results = document.getElementById("results");
      const outputs = [...document.querySelectorAll('input[name="outputs"]:checked')]
        .map((checkbox) => checkbox.value);

      if (outputs.length === 0) {
        error.textContent = "만들 결과를 한 개 이상 선택해주세요.";
        error.style.display = "block";
        return;
      }

      button.disabled = true;
      status.textContent = "생성 중입니다...";
      error.style.display = "none";
      results.style.display = "none";

      const payload = {
        request_id: `demo_${Date.now()}`,
        text: document.getElementById("prompt").value,
        image_path: null,
        outputs,
        options: {
          business_type: "food_retail",
          product_category: document.getElementById("product-category").value,
          sales_channel: document.getElementById("sales-channel").value,
          campaign_goal: document.getElementById("campaign-goal").value,
          target_audience: document.getElementById("audience").value || null,
          tone: document.getElementById("tone").value || null,
          copy_style: document.getElementById("copy-style").value,
          copy_length: document.getElementById("copy-length").value,
          use_emoji: document.getElementById("use-emoji").checked,
          must_include: commaSeparatedValues("must-include"),
          avoid_phrases: commaSeparatedValues("avoid-phrases"),
          custom_instruction: document.getElementById("custom-instruction").value || null,
          price: null,
          offer: null
        },
        source: { purpose: "browser_demo" }
      };

      try {
        const response = await fetch("/v1/generate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.detail || "생성 요청에 실패했습니다.");
        }

        const copyContainer = document.getElementById("copy-results");
        const assetContainer = document.getElementById("asset-results");
        copyContainer.replaceChildren();
        assetContainer.replaceChildren();

        if (data.copy) {
          addCopyCard(copyContainer, "헤드라인", data.copy.headline_candidates);
          addCopyCard(copyContainer, "본문", data.copy.body_candidates);
          addCopyCard(copyContainer, "CTA", data.copy.cta_candidates);
        }

        data.assets.forEach((asset) => {
          const filename = asset.path.split(/[\\/]/).pop();
          const card = document.createElement("article");
          card.className = "card";
          const image = document.createElement("img");
          image.src = `/v1/results/${encodeURIComponent(data.request_id)}/${encodeURIComponent(filename)}?t=${Date.now()}`;
          image.alt = `${asset.type} 생성 결과`;
          const body = document.createElement("div");
          body.className = "card-body";
          const heading = document.createElement("h3");
          heading.textContent = `${asset.type} · ${asset.width}×${asset.height}`;
          body.appendChild(heading);
          card.append(image, body);
          assetContainer.appendChild(card);
        });

        document.getElementById("metrics").textContent =
          `입력 모드: ${data.mode} · 시간: ${data.metrics.latency_ms}ms · 예상 비용: $${data.metrics.estimated_cost_usd.toFixed(4)}`;
        status.textContent = "완료되었습니다.";
        results.style.display = "block";
      } catch (caught) {
        error.textContent = caught instanceof Error ? caught.message : "알 수 없는 오류가 발생했습니다.";
        error.style.display = "block";
        status.textContent = "";
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
