global:
  scrape_interval: 15s

scrape_configs:
  - job_name: ad-service-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  # GPU 추론 서버를 띄운 경우.
  - job_name: ad-service-api-gpu
    metrics_path: /metrics
    static_configs:
      - targets: ["api-gpu:8000"]
    # api-gpu 프로파일이 꺼져 있으면 그냥 down 으로 표시된다.

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
